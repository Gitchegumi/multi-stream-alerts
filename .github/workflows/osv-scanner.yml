name: OSV Scanner PR

on:
  pull_request:

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-pr:
    name: Scan PR dependencies with OSV
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
