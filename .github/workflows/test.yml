name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Prisma generate
        run: corepack pnpm --filter @multi-stream-alerts/database prisma:generate

      - name: Typecheck
        run: corepack pnpm -r typecheck

      - name: Test (database)
        run: corepack pnpm --filter @multi-stream-alerts/database test

      - name: Test (web)
        run: corepack pnpm --filter @multi-stream-alerts/web test

      - name: Test (ingress)
        # ingress has no test script yet — assert at least a typecheck pass here.
        run: corepack pnpm --filter @multi-stream-alerts/ingress typecheck
