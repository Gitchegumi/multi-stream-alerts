name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @multi-stream-alerts/database prisma:generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (database)
        run: pnpm --filter @multi-stream-alerts/database test

      - name: Test (web)
        run: pnpm --filter @multi-stream-alerts/web test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Test (ingress)
        # ingress has no test script yet — assert at least a typecheck pass here.
        run: pnpm --filter @multi-stream-alerts/ingress typecheck
