name: Publish containers

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'alerts-web-v*.*.*'
      - 'alerts-ingress-v*.*.*'
      - 'alerts-worker-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/multi-stream-alerts

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: alerts-web
            build_arg: web
            tag_prefix: alerts-web-v
          - name: alerts-ingress
            build_arg: ingress
            tag_prefix: alerts-ingress-v
          - name: alerts-worker
            build_arg: worker
            tag_prefix: alerts-worker-v

    steps:
      - name: Decide whether to publish this service
        id: publish
        run: |
          ref_name="${GITHUB_REF_NAME}"
          tag_prefix="${{ matrix.service.tag_prefix }}"

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=branch build" >> "$GITHUB_OUTPUT"
          elif [[ "$ref_name" == "$tag_prefix"* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=service release tag" >> "$GITHUB_OUTPUT"
          elif [[ "$ref_name" == v* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=repo release tag" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=not this service tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.publish.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release metadata
        if: steps.publish.outputs.enabled == 'true'
        id: versions
        run: |
          ref_name="${GITHUB_REF_NAME}"
          release="$(jq -r .release version.json)"
          service="$(jq -r .version "apps/${{ matrix.service.build_arg }}/package.json")"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "$ref_name" == "${{ matrix.service.tag_prefix }}"* ]]; then
            service="${ref_name#${{ matrix.service.tag_prefix }}}"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "$ref_name" == v* ]]; then
            release="${ref_name#v}"
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$release" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "service_tag=v$service" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        if: steps.publish.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ steps.versions.outputs.service_tag }},enable=${{ github.ref_type == 'tag' && !startsWith(github.ref_name, 'v') }}
            type=raw,value=${{ steps.versions.outputs.release_tag }},enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.service.name }}
            org.opencontainers.image.description=GitcheGumi Alerts ${{ matrix.service.name }} container
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.versions.outputs.service_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ steps.versions.outputs.release_tag }}

      - name: Build and push image
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SERVICE=${{ matrix.service.build_arg }}
            RELEASE_VERSION=${{ steps.versions.outputs.release_tag }}
            SERVICE_VERSION=${{ steps.versions.outputs.service_tag }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
