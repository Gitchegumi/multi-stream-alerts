name: Publish containers

on:
  push:
    tags:
      - 'alerts-web-v*.*.*'
      - 'alerts-ingress-v*.*.*'
      - 'alerts-worker-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/multi-stream-alerts

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: alerts-web
            build_arg: web
            tag_prefix: alerts-web-v
          - name: alerts-ingress
            build_arg: ingress
            tag_prefix: alerts-ingress-v
          - name: alerts-worker
            build_arg: worker
            tag_prefix: alerts-worker-v

    steps:
      - name: Check if this service's tag was pushed
        id: publish
        run: |
          ref_name="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "reason=manual build" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=not a tag push" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_prefix="${{ matrix.service.tag_prefix }}"
          if [[ "$ref_name" == "$tag_prefix"* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=$ref_name matches $tag_prefix" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=$ref_name does not match $tag_prefix" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.publish.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release metadata
        if: steps.publish.outputs.enabled == 'true'
        id: versions
        run: |
          ref_name="${GITHUB_REF_NAME}"
          service_version="${ref_name#${{ matrix.service.tag_prefix }}}"
          release="$(jq -r .release version.json)"

          echo "service=$service_version" >> "$GITHUB_OUTPUT"
          echo "service_image_tag=v$service_version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$release" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        if: steps.publish.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ steps.versions.outputs.service_image_tag }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.service.name }}
            org.opencontainers.image.description=GitcheGumi Alerts ${{ matrix.service.name }} container
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.versions.outputs.service_image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ steps.versions.outputs.release_tag }}

      - name: Build and push image
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SERVICE=${{ matrix.service.build_arg }}
            RELEASE_VERSION=${{ steps.versions.outputs.release_tag }}
            SERVICE_VERSION=${{ steps.versions.outputs.service_image_tag }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
