services:
  alerts-web:
    image: ghcr.io/gitchegumi/multi-stream-alerts/alerts-web:${GITCHALERTS_VERSION:-v0.1.0}
    build:
      context: .
      args:
        SERVICE: web
        RELEASE_VERSION: ${GITCHALERTS_VERSION:-v0.1.0}
        SERVICE_VERSION: ${GITCHALERTS_WEB_VERSION:-0.1.0}
        GIT_SHA: ${GITCHALERTS_COMMIT_SHA:-local}
    container_name: alerts-web
    env_file:
      - .env
    environment:
      NEXTAUTH_URL: '${NEXTAUTH_URL:-${PUBLIC_BASE_URL}}'
      NEXTAUTH_SECRET: '${AUTH_SECRET}'
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      # Persist uploaded local assets outside the container. On TrueNAS,
      # point UPLOADS_PATH at a dataset path that survives app upgrades.
      - '${UPLOADS_PATH}:/app/uploads'
    depends_on:
      alerts-postgres:
        condition: service_healthy
      alerts-redis:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm prisma:migrate && pnpm --filter @multi-stream-alerts/web start']
    restart: unless-stopped

  alerts-ingress:
    image: ghcr.io/gitchegumi/multi-stream-alerts/alerts-ingress:${GITCHALERTS_VERSION:-v0.1.0}
    build:
      context: .
      args:
        SERVICE: ingress
        RELEASE_VERSION: ${GITCHALERTS_VERSION:-v0.1.0}
        SERVICE_VERSION: ${GITCHALERTS_INGRESS_VERSION:-0.1.0}
        GIT_SHA: ${GITCHALERTS_COMMIT_SHA:-local}
    container_name: alerts-ingress
    env_file:
      - .env
    ports:
      - '${INGRESS_PORT:-8080}:8080'
    depends_on:
      alerts-postgres:
        condition: service_healthy
      alerts-redis:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm --filter @multi-stream-alerts/ingress start']
    restart: unless-stopped

  alerts-worker:
    image: ghcr.io/gitchegumi/multi-stream-alerts/alerts-worker:${GITCHALERTS_VERSION:-v0.1.0}
    build:
      context: .
      args:
        SERVICE: worker
        RELEASE_VERSION: ${GITCHALERTS_VERSION:-v0.1.0}
        SERVICE_VERSION: ${GITCHALERTS_WORKER_VERSION:-0.1.0}
        GIT_SHA: ${GITCHALERTS_COMMIT_SHA:-local}
    container_name: alerts-worker
    env_file:
      - .env
    depends_on:
      alerts-postgres:
        condition: service_healthy
      alerts-redis:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm --filter @multi-stream-alerts/worker start']
    restart: unless-stopped

  alerts-postgres:
    image: postgres:17-alpine
    container_name: alerts-postgres
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    volumes:
      # Keep database files on persistent host storage, not container layers.
      - '${APP_DATA_PATH}/postgres:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alerts-redis:
    image: redis:7-alpine
    container_name: alerts-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      # Redis appendonly persistence also lives under APP_DATA_PATH.
      - '${APP_DATA_PATH}/redis:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
